[project]
name = "handwriting-synthesis"
version = "0.1.0"
description = "Handwriting synthesis with a Graves-style LSTM and Gaussian window attention, trained on IAM-OnDB, DeepWriting and InkSight-traced synthetic data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.44.0",
    "fonttools>=4.63.0",
    "huggingface-hub>=0.20,<1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-doctr[tf]>=0.12,<1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tensorflow>=2.21.0",
    "tensorflow-text>=2.21.1,<2.22",
    "tf-keras>=2.21,<2.22",
    "typesafe-sdk>=0.7.5",
]
